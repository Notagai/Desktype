name: Build and release Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Builds need read-only repository access. Only the tag-release job can publish releases.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Release tags must use vMAJOR.MINOR.PATCH (for example v1.2.3)."
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            [xml]$project = Get-Content "Desktype.csproj"
            $version = $project.Project.PropertyGroup.Version
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "The project Version must use MAJOR.MINOR.PATCH."
            }
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packaging Desktype version $version"

      - name: Publish self-contained single-file EXE
        shell: pwsh
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish Desktype.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version="$env:APP_VERSION" -o dist/publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          if (!(Test-Path dist/publish/Desktype.exe)) { throw "Published EXE was not produced" }
          Copy-Item dist/publish/Desktype.exe dist/Desktype.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "installer/Desktype.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          if (!(Test-Path dist/Desktype-Setup.exe)) { throw "Installer was not produced" }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = @()
          foreach ($file in @("dist/Desktype.exe", "dist/Desktype-Setup.exe")) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path $file -Leaf
            $lines += "$hash  $name"
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Desktype-Windows-x64
          path: |
            dist/Desktype.exe
            dist/Desktype-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download built release files
        uses: actions/download-artifact@v4
        with:
          name: Desktype-Windows-x64
          path: dist
          merge-multiple: true

      - name: Verify release files exist
        shell: pwsh
        run: |
          foreach ($file in @("dist/Desktype.exe", "dist/Desktype-Setup.exe", "dist/SHA256SUMS.txt")) {
            if (!(Test-Path $file)) { throw "Expected release file missing: $file" }
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Desktype release
          generate_release_notes: true
          files: |
            dist/Desktype.exe
            dist/Desktype-Setup.exe
            dist/SHA256SUMS.txt
