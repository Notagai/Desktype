name: Build and release Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Builds need read-only repository access. Only the tag-release job can publish releases.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Release tags must use vMAJOR.MINOR.PATCH (for example v1.2.3)."
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            [xml]$project = Get-Content "Desktype.csproj"
            $version = $project.Project.PropertyGroup.Version
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "The project Version must use MAJOR.MINOR.PATCH."
            }
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packaging Desktype version $version"

      - name: Publish self-contained single-file EXE
        shell: pwsh
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish Desktype.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version="$env:APP_VERSION" -o dist/publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          if (!(Test-Path dist/publish/Desktype.exe)) { throw "Published EXE was not produced" }
          Copy-Item dist/publish/Desktype.exe dist/Desktype.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "installer/Desktype.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          if (!(Test-Path dist/Desktype-Setup.exe)) { throw "Installer was not produced" }

      - name: Sign release binaries when a certificate is configured
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PFX: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PFX) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            Write-Warning "Signing certificate secrets are not configured; publishing this release unsigned. Configure WINDOWS_SIGNING_CERTIFICATE_PFX and WINDOWS_SIGNING_CERTIFICATE_PASSWORD to enable signing."
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "desktype-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_PFX))
              $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction Stop |
              Where-Object { $_.FullName -like '*x64*signtool.exe' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (!$signTool) { throw "Windows SDK signtool.exe was not found." }

            foreach ($file in @("dist/Desktype.exe", "dist/Desktype-Setup.exe")) {
              & $signTool.FullName sign /fd SHA256 /tr "https://timestamp.digicert.com" /td SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $file
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $file" }
              & $signTool.FullName verify /pa /v $file
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $file" }
            }
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = @()
          foreach ($file in @("dist/Desktype.exe", "dist/Desktype-Setup.exe")) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path $file -Leaf
            $lines += "$hash  $name"
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: Desktype-Windows-x64
          path: |
            dist/Desktype.exe
            dist/Desktype-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out full history for release ancestry validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag points to a commit on main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$env:GITHUB_SHA" "origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Refusing to publish: release tag must point to a commit contained in main."
          }

      - name: Download built release files
        uses: actions/download-artifact@fa0a91b85d4f404e444306234b4f18a22b3d1e57 # v4.1.8
        with:
          name: Desktype-Windows-x64
          path: dist
          merge-multiple: true

      - name: Verify release files exist
        shell: pwsh
        run: |
          foreach ($file in @("dist/Desktype.exe", "dist/Desktype-Setup.exe", "dist/SHA256SUMS.txt")) {
            if (!(Test-Path $file)) { throw "Expected release file missing: $file" }
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          name: Desktype release
          generate_release_notes: true
          files: |
            dist/Desktype.exe
            dist/Desktype-Setup.exe
            dist/SHA256SUMS.txt
